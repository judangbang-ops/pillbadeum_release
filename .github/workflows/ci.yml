# PR마다 공통 코드 JVM 테스트와 디버그 APK 빌드를 돌림 (TASK-033, 릴리즈 단계 R0).
# 서명 키·Play 업로드·패키지 이름은 여기서 다루지 않음 (TASK-001, TASK-002, TASK-038).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # 같은 PR에 새로 푸시하면 앞 실행을 멈춤. main은 커밋마다 끝까지 돌림.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm-test:
    name: JVM 테스트 (:shared:jvmTest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 커밋된 gradle-wrapper.jar가 Gradle 공식 배포본과 같은지 확인함
      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: ./gradlew :shared:jvmTest
        run: ./gradlew :shared:jvmTest

      - name: 테스트 결과 요약
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/junit_summary.py shared/build/test-results/jvmTest >> "$GITHUB_STEP_SUMMARY"

      - name: 테스트 보고서 올리기 (실패했을 때)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: jvmTest-report
          path: |
            shared/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
          retention-days: 7
          if-no-files-found: ignore

  debug-apk:
    name: 디버그 APK (:androidApp:assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Android SDK는 GitHub 호스트 러너에 있는 것(ANDROID_HOME)을 씀
      - name: ./gradlew :androidApp:assembleDebug
        run: ./gradlew :androidApp:assembleDebug

      - name: APK 정보
        env:
          APK: androidApp/build/outputs/apk/debug/androidApp-debug.apk
        run: |
          test -f "$APK"
          {
            echo "### 디버그 APK"
            echo ""
            echo "- 파일: \`$APK\` ($(du -h "$APK" | cut -f1))"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- 확인용임. 실행마다 새 디버그 키로 서명되어 이전 APK 위에 덮어 설치되지 않고, 지우고 다시 설치하면 기기 안 기록이 사라짐."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK 올리기
        uses: actions/upload-artifact@v5
        with:
          name: androidApp-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7
          if-no-files-found: error
