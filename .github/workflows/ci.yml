# PR마다 공통 코드 JVM 테스트와 디버그 APK 빌드를 돌림 (TASK-033, 릴리즈 단계 R0).
# 같은 실행에서 설계 문서끼리의 대조(.github/scripts/check_docs.py)도 따로 돌림.
# 서명 키·Play 업로드·패키지 이름은 여기서 다루지 않음 (TASK-001, TASK-002, TASK-038).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 PR에 새로 푸시하면 앞 실행을 멈춤. main 푸시·수동 실행은 커밋마다 따로 묶여 서로 취소하지 않음.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  docs:
    # 요구·화면·작업 분해·기록 규칙 보충이 서로 맞는지와 문서 안 링크·표 모양을 대조함.
    # 파이썬 표준 라이브러리만 씀. 문제가 하나라도 있으면 실패함.
    name: 문서 대조
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 요구·화면·작업 대조 (.github/scripts/check_docs.py)
        shell: bash
        run: |
          set +e
          python3 .github/scripts/check_docs.py . > "$RUNNER_TEMP/check_docs.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/check_docs.txt"
          { echo "### 문서 대조"; echo; echo '```'; cat "$RUNNER_TEMP/check_docs.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  build:
    # 한 작업에서 테스트와 APK 빌드를 차례로 함. 두 작업으로 나누면 같은 Gradle 캐시 키를 두고 다퉈
    # 늦게 끝난 쪽(Android 의존성)이 저장되지 않음 (2026-11-11 첫 실행에서 확인).
    name: JVM 테스트 + 디버그 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 커밋된 gradle-wrapper.jar가 Gradle 공식 배포본과 같은지 확인함. 서드파티 액션이라 커밋으로 고정함.
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --rerun: 입력이 같아도 빌드 캐시의 지난 결과를 쓰지 않고 테스트를 실제로 돌림 (테스트 자체는 2초 안쪽)
      - name: JVM 테스트 (./gradlew :shared:jvmTest)
        id: jvm-test
        run: ./gradlew :shared:jvmTest --rerun

      # 아래 단계들은 테스트가 실패해도 돌되, 그 앞(체크아웃·wrapper 검증)에서 멈췄으면 돌지 않음
      - name: 테스트 결과 요약
        if: ${{ !cancelled() && steps.jvm-test.outcome != 'skipped' }}
        shell: bash
        run: python3 .github/scripts/junit_summary.py shared/build/test-results/jvmTest | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 테스트 보고서 올리기 (테스트가 실패했을 때)
        if: ${{ !cancelled() && steps.jvm-test.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: jvmTest-report
          path: |
            shared/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      # Android SDK는 GitHub 호스트 러너에 있는 것(ANDROID_HOME)을 씀
      - name: 디버그 APK (./gradlew :androidApp:assembleDebug)
        id: debug-apk
        if: ${{ !cancelled() && steps.jvm-test.outcome != 'skipped' }}
        run: ./gradlew :androidApp:assembleDebug

      - name: APK 정보
        if: ${{ !cancelled() && steps.debug-apk.outcome == 'success' }}
        shell: bash
        env:
          APK: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          test -f "$APK"
          {
            echo "### 디버그 APK"
            echo ""
            echo "- 파일: \`$APK\` ($(du -h "$APK" | cut -f1))"
            echo "- 커밋: \`$HEAD_SHA\` (실제 빌드는 \`$BUILT_SHA\`. PR이면 base와 합친 머지 커밋임)"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- 확인용임. 실행마다 새 디버그 키로 서명되어 이전 APK 위에 덮어 설치되지 않고, 지우고 다시 설치하면 기기 안 기록이 사라짐."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # REQ-057: INTERNET 권한이 없고, 나머지 권한이 androidApp/expected-permissions.txt와 같아야 함
      - name: 권한 목록 비교 (REQ-057)
        if: ${{ !cancelled() && steps.debug-apk.outcome == 'success' }}
        shell: bash
        env:
          APK: androidApp/build/outputs/apk/debug/androidApp-debug.apk
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          echo "aapt2: $aapt2"
          "$aapt2" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"
          python3 .github/scripts/check_permissions.py "$RUNNER_TEMP/permissions.txt" androidApp/expected-permissions.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: APK 올리기
        if: ${{ !cancelled() && steps.debug-apk.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: androidApp-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7
          overwrite: true
          if-no-files-found: error
