# 에뮬레이터에서 백업·복원과 복원 감지를 확인함 (TASK-028, TASK-029, 릴리즈 단계 R0b).
# 앱 화면을 직접 눌러 기록하고, 시험용 백업 전송(LocalTransport)으로 백업 → 지우고 다시 설치 →
# 앱 파일을 root로 읽어 확인함. 경우와 기대 동작은 scripts/emulator/backup_restore_check.py 첫 주석.
#
# - 백업 규칙·복원 감지 코드를 바꾼 PR과 수동 실행에서만 돎(실행마다 약 15분 × API 수, 무료 분 한도).
#   PR에 다시 푸시할 때는 그 푸시가 아래 paths를 바꿨을 때만 돎(gate 작업, .github/scripts/push_gate.py)
# - 서명 키·비밀값을 쓰지 않음. 디버그 APK로 확인함
# - Android SDK·에뮬레이터는 러너에 있는 sdkmanager로 받음(.github/actions/android-emulator). 서드파티 액션을 쓰지 않음
name: 에뮬레이터 확인

on:
  pull_request:
    paths:
      - androidApp/src/main/AndroidManifest.xml
      - androidApp/src/main/res/xml/**
      - androidApp/src/main/kotlin/com/judangbang/pillbadeum/AppContainer.kt
      - androidApp/src/main/kotlin/com/judangbang/pillbadeum/restore/**
      - shared/src/commonMain/kotlin/com/judangbang/pillbadeum/restore/**
      - scripts/emulator/backup_restore_check.py
      - .github/actions/android-emulator/**
      - .github/scripts/push_gate.py
      - .github/workflows/emulator.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    # on.pull_request.paths는 PR 전체가 바꾼 파일을 봐서, 위 경로를 한 번 바꾼 PR은 문서만 고친 푸시에도
    # 아래 작업을 모두 다시 돌림. 이 PR에서 그 확인이 마지막으로 모두 성공한 커밋 뒤로 그 경로가 바뀌었는지 보고
    # 정함(.github/scripts/push_gate.py). 실패한 확인은 기준이 되지 않아 다음 푸시에서 다시 돎. PR을 열 때·다시 열
    # 때·알 수 없을 때는 돎. 경로는 위 on.pull_request.paths와 같게 둠('dir/**'는 'dir/'로 씀)
    # 수동 실행에서는 건너뜀
    name: 이번 푸시가 바꾼 파일
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # 지난 실행을 읽음
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: gate
        env:
          GATE_ACTION: ${{ github.event.action }}
          GATE_AFTER: ${{ github.event.after }}
          GATE_JOB: "백업·복원 (API"
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/push_gate.py
          androidApp/src/main/AndroidManifest.xml
          androidApp/src/main/res/xml/
          androidApp/src/main/kotlin/com/judangbang/pillbadeum/AppContainer.kt
          androidApp/src/main/kotlin/com/judangbang/pillbadeum/restore/
          shared/src/commonMain/kotlin/com/judangbang/pillbadeum/restore/
          scripts/emulator/backup_restore_check.py
          .github/actions/android-emulator/
          .github/scripts/push_gate.py
          .github/workflows/emulator.yml

  apk:
    name: 디버그 APK
    needs: gate
    # gate가 run=false라고 할 때만 건너뜀. 수동 실행(gate 건너뜀)이나 gate 실패 때는 돎
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 디버그 APK (./gradlew :androidApp:assembleDebug)
        run: ./gradlew :androidApp:assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: emulator-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  backup:
    name: 백업·복원 (API ${{ matrix.api }})
    needs: apk
    # gate를 건너뛴 실행에서도 돌게 apk 결과만 봄(기본 조건은 건너뛴 gate 때문에 이 작업까지 건너뜀)
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 34: 클라우드 백업(암호화 있음·없음)·기기 간 이전·복원 감지 전부
        # 30: Android 9~11 규칙(시험 전송은 암호화 플래그를 켤 수 없어 '안 올라감'만 확인)
        # 27, 26: Android 8.x는 백업하지 않음 (RR-70). 27은 google_apis x86_64 이미지가 없어 default 이미지로 함
        api: [34, 30, 27, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: emulator-apk
          path: ${{ runner.temp }}/apk

      # KVM, 시스템 이미지(API 27은 default 이미지), AVD를 준비하고 부팅을 기다림
      - uses: ./.github/actions/android-emulator
        with:
          api: ${{ matrix.api }}

      - name: 백업·복원 확인 (scripts/emulator/backup_restore_check.py)
        id: check
        run: |
          python3 scripts/emulator/backup_restore_check.py \
            --apk "$RUNNER_TEMP/apk/androidApp-debug.apk" \
            --out "$RUNNER_TEMP/emulator-${{ matrix.api }}"

      - name: 결과 표
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/emulator-${{ matrix.api }}/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "보고서 없음" >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/emulator-${{ matrix.api }}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: emulator-backup-api${{ matrix.api }}
          path: ${{ runner.temp }}/emulator-${{ matrix.api }}/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
