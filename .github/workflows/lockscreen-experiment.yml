# 잠금 화면 알림 실험 (TASK-025 준비, 2026-11-12 검토 B6, REQ-046·REQ-076). 제품 확인이 아님.
# 실험 앱(experiments/lockscreen)이 같은 알림을 공개 범위 방법별로 올리고, 스크립트가 PIN을 건 에뮬레이터를
# 잠가 기기 설정('내용 표시'·'내용 숨김')마다 잠금 화면과 알림창에 약 이름·버튼이 보이는지 읽음.
# 경우와 읽는 법은 scripts/emulator/lockscreen_experiment.py 첫 주석.
#
# - 실험 브랜치 푸시와 수동 실행에서만 돎. PR·main에서는 돌지 않음
# - 서명 키·비밀값을 쓰지 않음. 실험 앱 디버그 APK로 함
name: 잠금 화면 알림 실험

on:
  push:
    branches: [claude/project-thread-4ynq4n]
    paths:
      - experiments/lockscreen/**
      - scripts/emulator/lockscreen_experiment.py
      - .github/workflows/lockscreen-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockscreen-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: 실험 앱 APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 실험 앱 APK (./gradlew -PlockscreenExperiment :experiments:lockscreen:assembleDebug)
        run: ./gradlew -PlockscreenExperiment :experiments:lockscreen:assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: lockscreen-experiment-apk
          path: experiments/lockscreen/build/outputs/apk/debug/lockscreen-debug.apk
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  experiment:
    name: 잠금 화면 (API ${{ matrix.api }})
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 26: 최소 지원(minSdk), 30: Android 11, 34: Android 14, 36: 대상 API(targetSdk)
        api: [26, 30, 34, 36]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: lockscreen-experiment-apk
          path: ${{ runner.temp }}/apk

      - uses: ./.github/actions/android-emulator
        with:
          api: ${{ matrix.api }}

      - name: 잠금 화면 실험 (scripts/emulator/lockscreen_experiment.py)
        run: |
          python3 scripts/emulator/lockscreen_experiment.py \
            --apk "$RUNNER_TEMP/apk/lockscreen-debug.apk" \
            --out "$RUNNER_TEMP/lockscreen-${{ matrix.api }}"

      - name: 결과 표
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/lockscreen-${{ matrix.api }}/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "보고서 없음" >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/lockscreen-${{ matrix.api }}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: lockscreen-experiment-api${{ matrix.api }}
          path: ${{ runner.temp }}/lockscreen-${{ matrix.api }}/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
