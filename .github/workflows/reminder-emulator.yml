# 에뮬레이터에서 복용 알림을 확인함 (TASK-024·025·027·040, 릴리즈 단계 R3).
# 알람 하나(정확·비정확), 잠금 화면 여덟 칸, 버튼, 놓친 알람, 복원 안내, 재부팅, 창 끝, 다시 계산(첫 알림 시각 바꾸기·
# 시계 되돌리기·대상자 보관·기기 시간대), 늦은 알람.
# 경우와 기대 동작은 scripts/emulator/reminder_check.py 첫 주석. 실기기 확인은 TASK-032·052.
#
# - 알림 코드를 바꾼 PR과 수동 실행에서 돎(API마다 나란히. TASK-027 단계를 더한 실행 43429029456에서 API마다
#   24~28분, 실행 전체 약 30분). 저장소가 공개라 Actions 사용 시간 한도가 없어(2026-11-13) PR에서도
#   API 34·36·30·26을 모두 돌림. PR에 다시 푸시할 때는 이 확인이 마지막으로 모두 성공한 커밋 뒤로 아래 paths가
#   바뀌었을 때만 돎(gate 작업, .github/scripts/push_gate.py). 라벨 `emulator-reminders`를 붙이면 그 PR로 다시 돎
#   (reminder_check.py가 backup_restore_check·explore·release_check의 도우미를 써서 scripts/emulator 전체를 봄)
# - 서명 키·비밀값을 쓰지 않음. 디버그 APK로 확인함. 알림 켠 항목은 디버그 빌드에만 있는 수신기
#   (androidApp/src/debug/.../ReminderSeedReceiver.kt)로 앱의 use case를 불러 만듦. 항목 화면의 알림 칸(TASK-023)은
#   앱 시험 ItemReminderTest가 봄
# - Android SDK·에뮬레이터는 러너에 있는 sdkmanager로 받음(.github/actions/android-emulator). 서드파티 액션을 쓰지 않음
name: 에뮬레이터 알림 확인

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - androidApp/src/main/AndroidManifest.xml
      - androidApp/src/main/kotlin/com/judangbang/pillbadeum/AppContainer.kt
      - androidApp/src/main/kotlin/com/judangbang/pillbadeum/reminder/**
      - androidApp/src/main/kotlin/com/judangbang/pillbadeum/boundary/**
      - androidApp/src/debug/**
      - shared/src/commonMain/kotlin/com/judangbang/pillbadeum/domain/Reminders.kt
      - shared/src/commonMain/kotlin/com/judangbang/pillbadeum/usecase/Reminders.kt
      - shared/src/commonMain/kotlin/com/judangbang/pillbadeum/status/ReminderLabels.kt
      - shared/src/commonMain/kotlin/com/judangbang/pillbadeum/data/Settings.kt
      - scripts/emulator/**
      - .github/actions/android-emulator/**
      - .github/scripts/push_gate.py
      - .github/workflows/reminder-emulator.yml
  workflow_dispatch:
    inputs:
      apis:
        description: API 수준 목록 (JSON 배열)
        required: false
        default: "[34, 36, 30, 26]"

permissions:
  contents: read

# 다른 라벨을 붙인 실행이 돌고 있는 확인을 취소하지 않게 라벨 이름을 그룹에 넣음(푸시는 'push')
concurrency:
  group: reminder-emulator-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}-${{ github.event.label.name || 'push' }}
  cancel-in-progress: true

jobs:
  gate:
    # on.pull_request.paths는 PR 전체가 바꾼 파일을 봐서, 위 경로를 한 번 바꾼 PR은 문서만 고친 푸시에도
    # 아래 작업을 모두 다시 돌림. 이 PR에서 그 확인이 마지막으로 모두 성공한 커밋 뒤로 그 경로가 바뀌었는지 보고
    # 정함(.github/scripts/push_gate.py). 실패한 확인은 기준이 되지 않아 다음 푸시에서 다시 돎. PR을 열 때·다시 열
    # 때·알 수 없을 때는 돎. 경로는 위 on.pull_request.paths와 같게 둠('dir/**'는 'dir/'로 씀)
    # 라벨을 붙여 온 실행은 `emulator-reminders`일 때만 돌고, 그때는 늘 돎. 수동 실행에서는 건너뜀
    name: 이번 푸시가 바꾼 파일
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'emulator-reminders')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # 지난 실행을 읽음
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: gate
        env:
          GATE_ACTION: ${{ github.event.action }}
          GATE_AFTER: ${{ github.event.after }}
          GATE_JOB: "알림 (API"
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/push_gate.py
          androidApp/src/main/AndroidManifest.xml
          androidApp/src/main/kotlin/com/judangbang/pillbadeum/AppContainer.kt
          androidApp/src/main/kotlin/com/judangbang/pillbadeum/reminder/
          androidApp/src/main/kotlin/com/judangbang/pillbadeum/boundary/
          androidApp/src/debug/
          shared/src/commonMain/kotlin/com/judangbang/pillbadeum/domain/Reminders.kt
          shared/src/commonMain/kotlin/com/judangbang/pillbadeum/usecase/Reminders.kt
          shared/src/commonMain/kotlin/com/judangbang/pillbadeum/status/ReminderLabels.kt
          shared/src/commonMain/kotlin/com/judangbang/pillbadeum/data/Settings.kt
          scripts/emulator/
          .github/actions/android-emulator/
          .github/scripts/push_gate.py
          .github/workflows/reminder-emulator.yml

  apk:
    name: 디버그 APK
    needs: gate
    # 수동 실행(gate 건너뜀)이나 gate 실패 때는 돎. gate가 run=false라고 하거나 다른 라벨이면 건너뜀
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && (github.event.action != 'labeled' || github.event.label.name == 'emulator-reminders') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 디버그 APK (./gradlew :androidApp:assembleDebug)
        run: ./gradlew :androidApp:assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: reminder-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  reminders:
    name: 알림 (API ${{ matrix.api }})
    needs: apk
    # 건너뛴 gate가 apk를 거쳐 이 작업까지 건너뛰게 하지 않게 apk 결과만 봄(수동 실행)
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    # 다시 계산·늦은 알람 단계(TASK-027)를 더해 시계를 열 번 남짓 더 바꾸므로(바꿀 때마다 시스템 멈춤을 기다림) 60분에서
    # 늘림. 그 단계를 더한 실행 43429029456은 API마다 24~28분. 느린 러너와 재부팅에서 에뮬레이터를 껐다 켜는 경우를 위해
    # 여유를 둠
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 34: 기준. 36: 가장 새 Android(알림 묶음 규칙이 바뀜). 30: 정확 알람 권한이 없는 Android 11.
        # 26: 알림 권한·정확 알람 권한이 없는 가장 낮은 지원 버전
        api: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.apis || '[34, 36, 30, 26]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: reminder-apk
          path: ${{ runner.temp }}/apk

      # KVM, 시스템 이미지, AVD를 준비하고 부팅을 기다림 (백업·복원 확인과 같은 액션). 시계를 바꾸므로 코어 4개
      - uses: ./.github/actions/android-emulator
        with:
          api: ${{ matrix.api }}
          cores: "4"

      - name: 알림 확인 (scripts/emulator/reminder_check.py)
        run: |
          python3 scripts/emulator/reminder_check.py \
            --apk "$RUNNER_TEMP/apk/androidApp-debug.apk" \
            --out "$RUNNER_TEMP/reminders-${{ matrix.api }}"

      - name: 결과 표
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/reminders-${{ matrix.api }}/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "보고서 없음" >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/reminders-${{ matrix.api }}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: reminders-api${{ matrix.api }}
          path: ${{ runner.temp }}/reminders-${{ matrix.api }}/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
