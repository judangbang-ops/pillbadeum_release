# R2 화면 작업(TASK-012·013·015·016·018·019·021·022·043)의 끝 조건인 에뮬레이터 캡처를 한 번에 찍고 확인함.
# 위젯 대상자 고르기, 대상자 관리, 판정 고치기, 지난 기록, 시계 경고, 휴대폰 시간대, 첫 실행 안내의 [위젯 추가].
# 흐름과 이유는 scripts/emulator/screens_check.py 첫 주석. 단계마다 화면 덤프(읽는 문장)와 DB를 보고 판정하고,
# 캡처는 사람이 화면을 보는 데 씀(팀에 지금 쓸 Android 폰이 없음, 2026-11-12).
#
# - 이 스크립트·워크플로를 바꾼 PR과 수동 실행에서만 돎 (약 30분, 무료 분 한도).
#   PR에 다시 푸시할 때는 그 푸시가 아래 paths를 바꿨을 때만 돎(gate 작업, .github/scripts/push_gate.py)
# - 서명 키·비밀값을 쓰지 않음. 디버그 APK로 봄(DB를 root로 읽고, 디버그 수신기로 위젯을 다시 그림)
name: 에뮬레이터 화면 확인

on:
  pull_request:
    paths:
      - scripts/emulator/screens_check.py
      # screens_check.py가 쓰는 도우미(화면 덤프·탭·위젯 놓기·시계·DB 읽기). 바꾸면 화면 확인도 다시 돎
      - scripts/emulator/explore.py
      - scripts/emulator/backup_restore_check.py
      - scripts/emulator/release_check.py
      - scripts/emulator/reminder_check.py
      - scripts/emulator/emulator_boot.py
      - .github/scripts/push_gate.py
      - .github/workflows/screens.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screens-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    # 둘러보기(explore.yml)의 gate와 같음: 이 PR에서 이 확인이 마지막으로 모두 성공한 커밋 뒤로 위 경로가 바뀌었는지 보고
    # 정함. 실패한 확인은 기준이 되지 않아 다음 푸시에서 다시 돎. PR을 열 때·다시 열 때·알 수 없을 때는 돎.
    # 경로는 위 on.pull_request.paths와 같게 둠. 수동 실행에서는 건너뜀
    name: 이번 푸시가 바꾼 파일
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # 지난 실행을 읽음
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: gate
        env:
          GATE_ACTION: ${{ github.event.action }}
          GATE_AFTER: ${{ github.event.after }}
          GATE_JOB: "화면 확인 (API"
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/push_gate.py
          scripts/emulator/screens_check.py
          scripts/emulator/explore.py
          scripts/emulator/backup_restore_check.py
          scripts/emulator/release_check.py
          scripts/emulator/reminder_check.py
          scripts/emulator/emulator_boot.py
          .github/scripts/push_gate.py
          .github/workflows/screens.yml

  screens:
    name: 화면 확인 (API 34)
    needs: gate
    # gate가 run=false라고 할 때만 건너뜀. 수동 실행(gate 건너뜀)이나 gate 실패 때는 돎
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 디버그 APK (./gradlew :androidApp:assembleDebug)
        run: |
          ./gradlew :androidApp:assembleDebug
          # 에뮬레이터와 CPU·메모리를 나누지 않게 Gradle 데몬을 끔 (2026-11-12 둘러보기 5회차의 시스템 ANR)
          ./gradlew --stop

      # KVM, 시스템 이미지, AVD를 준비하고 부팅을 기다림 (둘러보기와 같은 액션, Pixel 런처)
      - uses: ./.github/actions/android-emulator
        with:
          api: "34"
          cores: "4"

      - name: 화면 확인 (scripts/emulator/screens_check.py)
        run: |
          python3 scripts/emulator/screens_check.py \
            --apk androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            --out "$RUNNER_TEMP/screens"

      - name: 결과 표
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/screens/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "보고서 없음" >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/screens/" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: screens-api34
          path: ${{ runner.temp }}/screens/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
