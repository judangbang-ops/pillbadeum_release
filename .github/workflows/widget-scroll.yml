# 위젯 스크롤 기술 시험 (TASK-042, REQ-078, 화면 5장 1번).
# Glance 목록(LazyVerticalGrid·LazyColumn) 안 버튼의 탭이 기록되는지와 4×2에 가로 4개가 들어가는지를
# 에뮬레이터 API 26·34·36에서 봄. 경우와 기대 동작은 scripts/emulator/widget_scroll_check.py 첫 주석.
#
# - 디버그 APK에만 있는 위젯 호스트(androidApp/src/debug)로 위젯을 정확한 크기로 띄움. 런처를 조작하지 않음
# - 제품 위젯(DidITakeWidget)은 바꾸지 않음. 시험용 위젯이 같은 WidgetModel과 같은 RecordFromWidget을 씀
# - 이 시험의 코드가 바뀐 PR과 수동 실행에서만 돎. 서명 키·비밀값을 쓰지 않음
name: 위젯 스크롤 기술 시험

on:
  pull_request:
    paths:
      - androidApp/src/debug/**
      - androidApp/src/main/kotlin/com/judangbang/pillbadeum/widget/**
      - scripts/emulator/widget_scroll_check.py
      - .github/actions/android-emulator/**
      - .github/workflows/widget-scroll.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-scroll-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  apk:
    name: 디버그 APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 디버그 APK (./gradlew :androidApp:assembleDebug)
        run: ./gradlew :androidApp:assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: widget-scroll-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  scroll:
    name: 위젯 스크롤 (API ${{ matrix.api }})
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # 26: 최소 지원(RemoteViewsService 경로), 34: 지금 흔한 폰, 36: 대상 API (작업 분해 TASK-042)
        api: [26, 34, 36]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: widget-scroll-apk
          path: ${{ runner.temp }}/apk

      - uses: ./.github/actions/android-emulator
        with:
          api: ${{ matrix.api }}

      - name: 위젯 스크롤 확인 (scripts/emulator/widget_scroll_check.py)
        env:
          COMMIT: ${{ github.event_name == 'pull_request' && format('{0} (PR 머리 {1})', github.sha, github.event.pull_request.head.sha) || github.sha }}
        run: |
          python3 scripts/emulator/widget_scroll_check.py \
            --apk "$RUNNER_TEMP/apk/androidApp-debug.apk" \
            --out "$RUNNER_TEMP/widget-scroll-${{ matrix.api }}" --commit "$COMMIT"

      - name: 결과 표
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/widget-scroll-${{ matrix.api }}/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "보고서 없음" >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/widget-scroll-${{ matrix.api }}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: widget-scroll-api${{ matrix.api }}
          path: ${{ runner.temp }}/widget-scroll-${{ matrix.api }}/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
