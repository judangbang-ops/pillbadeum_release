# 화면 목록 (사이트맵) — 1차 범위 확정 반영 2026-11-12 (화면 5장 7개, 2026-11-12 10:18 KST 동희님 확정). 처음 초안 2026-11-11, Claude 작성
# CORTHEX 07 다시 하기 2026-11-12 (Claude): 흐름을 03의 FL ID로, terms를 01의 CTX·TERM으로 바꿈. 화면 구성은 그대로. 내비게이션 확인 끝 (2026-11-13 01:04 KST 동희님 "추천모두승인", 질문은 00:55 KST 메시지 2번, screens.md 6장)
#
# - 기준: DidITake develop 7a800ac (이 저장소로 가져온 코드와 같음). 요구는 ../01-planning/requirements.md, 화면별 상태는 screens.md
# - 이 파일이 화면 목록의 원본임. screens.md 1장의 그림과 표는 draw_sitemap.py로 이 파일에서 그림(손으로 고치지 않음)
# - path: 안드로이드 화면이라 URL이 아님. 진입 지점별로 widget: / notification: / app: 을 붙임
# - 진입 지점이 셋(홈 화면 위젯, 알림, 앱 아이콘)이라 최상위 항목이 셋임
# - access: 계정이 없어 모두 '기기 사용자'임. 잠금 화면에 보이는 것만 따로 적음
# - flows: 이 화면을 지나는 흐름 ID(../03-user-flow/FL-*.md에 이 화면 ID가 나오는 흐름). check_docs.py가 두 쪽을 대조함
# - reqs: 이 화면이 쓰는 요구 ID. screens.md의 그 화면 절에 나오는 요구 ID와 같아야 함 (.github/scripts/check_docs.py가 대조함)
# - code: 이 저장소 main(2026-11-12 843a737, DidITake 7a800ac 프로토타입에서 패키지 이름만 바뀜)에 있는 정도 (있음 / 일부 / 없음). Claude가 코드를 읽고 판단함
# - terms: 이 화면이 보이는 맥락(CTX)과 용어(TERM), ../01-domain/domain.md. 보이는 것이 없으면 none
# - links: 부모·자식이 아닌 화면으로 가는 길 "SCR-xxx: 하는 일". screens.md 1장의 그림은 이 파일에서 .github/scripts/draw_sitemap.py가 그림
#
# without a screen: TERM-001 (챙기는 사람: 앱을 쓰는 사람 자체), TERM-006·TERM-007 (창·기간키: 계산에만 씀),
#   TERM-009·TERM-010 (먹음·건너뜀: 판정 값으로 여러 화면에 글자로 보임), TERM-020 (기록한 곳: 저장만 함),
#   TERM-022 (알림 칸: 계산), TERM-027 (기기 표식: 보이지 않음),
#   TERM-028·TERM-029 (복원·복원 안내: 화면이 아니라 SCR-001·SCR-003·SCR-004의 restored 상태, 08에서 다룸)

