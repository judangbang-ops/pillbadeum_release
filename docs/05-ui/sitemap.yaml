      reqs: [REQ-011, REQ-015, REQ-036, REQ-046, REQ-049, REQ-050, REQ-051, REQ-053, REQ-054, REQ-055]
      terms: none
      children:
        - id: SCR-010
          name: 대상자 관리
          path: app:/settings/people
