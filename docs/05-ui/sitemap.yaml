# 화면 목록 (사이트맵) — 초안 2026-11-11, Claude 작성. 범위 확정 전
#
# - 기준: DidITake develop 7a800ac (이 저장소로 가져온 코드와 같음). 요구는 ../01-planning/requirements.md, 화면별 상태는 screens.md
# - 이 파일이 화면 목록의 원본임. screens.md 1장의 그림과 표는 이 파일에서 옮겨 그림
# - path: 안드로이드 화면이라 URL이 아님. 진입 지점별로 widget: / notification: / app: 을 붙임
# - 진입 지점이 셋(홈 화면 위젯, 알림, 앱 아이콘)이라 최상위 항목이 셋임
# - access: 계정이 없어 모두 '기기 사용자'임. 잠금 화면에 보이는 것만 따로 적음
# - flows: DidITake docs/04-flow/flows.md(7a800ac)의 장 번호 (플로우에 FL ID가 아직 없음)
# - reqs: 이 화면이 쓰는 요구 ID
# - code: 7a800ac 코드(DidITake에서 이 저장소로 가져옴)에 있는 정도 (있음 / 일부 / 없음). Claude가 코드를 읽고 판단함
# - terms: 도메인 단계(01)를 하지 않아 모두 none

- id: SCR-001
  name: 홈 화면 위젯
  path: widget:home
  access: 위젯을 놓은 기기 사용자
  status: active
  code: 있음 (대상자 필터·넘칠 때 처리는 없음)
  flows: [플로우 1, 플로우 2, 플로우 3]
  reqs: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-005, REQ-007, REQ-008, REQ-014, REQ-017, REQ-018, REQ-019, REQ-020, REQ-021, REQ-022, REQ-023, REQ-024, REQ-025, REQ-026, REQ-027, REQ-033, REQ-043, REQ-056, REQ-068]
  terms: none
  children:
    - id: SCR-002
      name: 위젯 대상자 고르기
      path: widget:configure
      access: 위젯을 놓거나 위젯 설정을 연 기기 사용자
      status: active
      code: 없음
      flows: [플로우 1]
      reqs: [REQ-016, REQ-017, REQ-018, REQ-025]
      terms: none

- id: SCR-003
  name: 반복 알림
  path: notification:reminder
  access: 알림 권한을 허용한 기기 사용자. 잠금 화면에서는 약 이름을 숨김(기본)
  status: active
  code: 없음
  flows: [플로우 1, 플로우 4]
  reqs: [REQ-003, REQ-004, REQ-027, REQ-041, REQ-042, REQ-043, REQ-044, REQ-045, REQ-046, REQ-047, REQ-049, REQ-056]
  terms: none

- id: SCR-004
  name: 기록 (오늘·이번 주)
  path: app:/
  access: 기기 사용자
  status: active
  code: 있음 (건너뜀·미래 시각 경고·권한 안내는 없음)
  flows: [플로우 1, 플로우 2]
  reqs: [REQ-001, REQ-002, REQ-003, REQ-007, REQ-009, REQ-018, REQ-028, REQ-029, REQ-033, REQ-035, REQ-036, REQ-044, REQ-049, REQ-050]
  terms: none
  children:
    - id: SCR-005
      name: 첫 실행 안내
      path: app:/welcome
      access: 처음 실행한 기기 사용자
      status: active
      code: 없음
      flows: [플로우 1]
      reqs: [REQ-016, REQ-036, REQ-049]
      terms: none
    - id: SCR-006
      name: 항목 추가·수정
      path: app:/intake/:intakeId
      access: 기기 사용자
      status: active
      code: 있음 (알림 설정·권한 요청은 없음)
      flows: [플로우 1, 플로우 4]
