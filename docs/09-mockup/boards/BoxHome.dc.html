<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-004 기록 (오늘·이번 주)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&amp;family=Roboto:wght@400;600;800&amp;display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="box.css">
<style>
.hero{display:flex;align-items:center;gap:var(--space-md);padding:0 var(--space-2xs)}
.d1{font-size:var(--font-size-title-md);font-weight:var(--font-weight-extrabold);line-height:1.3}
.d2{font-size:var(--font-size-body-sm);color:var(--color-ink-muted);line-height:var(--font-line-height-normal)}
.d2 b{color:var(--color-ink-default);font-weight:var(--font-weight-extrabold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}
.t{position:relative;border-radius:var(--radius-tile);padding:var(--space-md) var(--space-md) 10px;display:flex;flex-direction:column;gap:2px;min-height:148px;
  background:var(--p-tint);color:var(--p-ink)}
.t .who{font-size:var(--font-size-body-sm);font-weight:var(--font-weight-semibold)}
.t .nm{font-size:var(--font-size-title-sm);font-weight:var(--font-weight-extrabold);line-height:1.3}
.t .sub{font-size:var(--font-size-body-sm);line-height:1.35}
.t .sp{flex-grow:1}
.t.done{background:var(--p-solid);color:var(--color-ink-on-solid)}
.t.skip{background:var(--color-surface-skip);color:var(--color-ink-muted)}
.mo{position:absolute;top:var(--space-2xs);right:2px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:inherit}
.t .btn{margin-top:var(--space-sm)}
.t.done .btn{background:transparent;border:var(--border-strong) solid var(--color-ink-on-solid);color:var(--color-ink-on-solid);font-weight:var(--font-weight-semibold)}
.wk{border:var(--border-thin) solid var(--color-line-subtle);border-radius:var(--radius-tile);padding:var(--space-md) var(--space-md) var(--space-xs)}
.wh,.wr{display:grid;grid-template-columns:64px repeat(7,1fr);align-items:center;column-gap:var(--space-2xs)}
.wh span{font-size:var(--font-size-body-sm);color:var(--color-ink-muted);text-align:center;font-weight:var(--font-weight-semibold)}
.wh span.today{color:var(--color-ink-default);font-weight:var(--font-weight-extrabold)}
.wr{min-height:40px}
.wr b{font-size:var(--font-size-body-sm);font-weight:var(--font-weight-semibold);white-space:nowrap;overflow:hidden}
/* 글자가 크면 약 이름을 칸 위 한 줄로 올림 */
.fs200 .grid{grid-template-columns:1fr}
.fs200 .t{min-height:0}
.fs200 .wh,.fs200 .wr{grid-template-columns:repeat(7,1fr)}
.fs200 .wh span:first-child{display:none}
.fs200 .wr b{grid-column:1 / -1;white-space:normal;padding-top:var(--space-xs)}
</style>
</helmet>
<div class="s {{fs}}">
  <div class="bar">
    <h1>기록</h1>
    <button class="tb" type="button">지난 기록</button>
    <button class="tb" type="button">설정</button>
  </div>
  <div class="body">
    <div class="hero">
      <span class="dow" aria-hidden="true">목</span>
      <div><p class="d1">11월 12일 목요일</p><p class="d2"><b>2 / 4</b> 완료 · 건너뜀 1 · 하루 시작 04:00</p></div>
    </div>

    <h2>오늘</h2>
    <div class="grid">
      <div class="t p1 done">
        <span class="who">나</span><span class="nm">아침약</span><span class="sub">매일 · 오늘 08:02 먹음</span>
        <span class="sp"></span>
        <button class="btn" type="button">기록 취소</button>
        <button class="mo" type="button" aria-label="아침약 판정 고치기"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.8" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="currentColor"/><circle cx="16" cy="10" r="1.8" fill="currentColor"/></svg></button>
      </div>
      <div class="t skip">
        <span class="who">나</span><span class="nm">비타민D</span><span class="sub">매일 · 건너뜀 09:10</span>
        <span class="sp"></span>
        <button class="mo" type="button" aria-label="비타민D 판정 고치기"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.8" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="currentColor"/><circle cx="16" cy="10" r="1.8" fill="currentColor"/></svg></button>
      </div>
      <div class="t p2">
        <span class="who">엄마</span><span class="nm">혈압약</span><span class="sub">매일 · 마지막 복용 어제&nbsp;21:40</span>
        <span class="sp"></span>
        <button class="btn p" type="button">먹었어</button>
        <button class="mo" type="button" aria-label="혈압약 판정 고치기"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.8" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="currentColor"/><circle cx="16" cy="10" r="1.8" fill="currentColor"/></svg></button>
      </div>
      <div class="t p2">
        <span class="who">엄마</span><span class="nm">골다공증약</span><span class="sub">주 1회 월요일</span><span class="sub" style="font-weight: var(--font-weight-extrabold)">마지막 복용 11/02(월)&nbsp;08:10</span>
        <span class="sp"></span>
        <button class="btn p" type="button">먹었어</button>
        <button class="mo" type="button" aria-label="골다공증약 판정 고치기"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.8" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="currentColor"/><circle cx="16" cy="10" r="1.8" fill="currentColor"/></svg></button>
      </div>
    </div>

    <h2>이번 주 약통</h2>
    <div class="wk">
      <div class="wh"><span></span><span>월</span><span>화</span><span>수</span><span class="today">목</span><span>금</span><span>토</span><span>일</span></div>
      <div class="wr p1" aria-label="아침약 이번 주: 월 화 수 목 복용"><b>아침약</b><span class="cell taken"></span><span class="cell taken"></span><span class="cell taken"></span><span class="cell taken now"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="wr p1" aria-label="비타민D 이번 주: 월 화 수 복용, 목 건너뜀"><b>비타민D</b><span class="cell taken"></span><span class="cell taken"></span><span class="cell taken"></span><span class="cell skip now"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
      <div class="wr p2" aria-label="혈압약 이번 주: 월 화 복용, 수 빠짐, 목 아직"><b>혈압약</b><span class="cell taken"></span><span class="cell taken"></span><span class="cell miss"></span><span class="cell todo now"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></div>
    </div>

    <button class="btn ink" type="button" style="margin-top: var(--space-lg)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>항목 추가</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fontScale":{"editor":"enum","options":["100","200"],"default":"100"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { fs: (this.props.fontScale ?? '100') === '200' ? 'fs200' : '' };
  }
}
</script>
</body>
</html>
