<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-010 대상자 추가</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&amp;display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="box.css">
<style>
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-sm)}
.sw{height:var(--size-target);border-radius:var(--radius-button);border:0;background:var(--p-solid);color:var(--color-ink-on-solid);display:flex;align-items:center;justify-content:center;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--color-surface-default),0 0 0 4px var(--color-ink-default)}
</style>
</helmet>
<div class="s {{fs}}">
  <div class="bar back"><button class="ib" type="button" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>대상자 추가</h1></div>
  <div class="body">
    <div class="fld"><label>이름</label><div class="in focus">아빠</div></div>
    <div class="fld"><span class="lbl">색</span><div class="sws"><button class="sw p1" type="button" aria-label="파랑"></button><button class="sw p2" type="button" aria-label="주황"></button><button class="sw p3 on" type="button" aria-label="초록" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="sw p4" type="button" aria-label="보라"></button><button class="sw p5" type="button" aria-label="장미"></button><button class="sw p6" type="button" aria-label="청록"></button></div>
      <p class="note">파랑·주황은 나·엄마가 쓰고 있어요. 같은 색도 고를 수 있어요.</p></div>
    <div class="band">한 약은 한 휴대폰에서 기록해 주세요. 아빠 약을 아빠 휴대폰에서도 기록하면 두 기록이 서로 보이지 않아요.</div>
  </div>
  <div class="foot line"><button class="btn ink" type="button">저장</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fontScale": {"editor": "enum", "options": ["100", "200"], "default": "100"}, "$preview": {"width": 360, "height": 800}}'>
class Component extends DCLogic {
  renderVals() {
    return { fs: (this.props.fontScale ?? '100') === '200' ? 'fs200' : '' };
  }
}
</script>
</body>
</html>
