<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-010 대상자 수정 · 건강 카드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&amp;family=Roboto:wght@400;600;800&amp;display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="box.css">
<style>
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-sm)}
.fs200 .sws{grid-template-columns:repeat(3,1fr)}
.sw{height:var(--size-target);border-radius:var(--radius-button);border:0;background:var(--p-solid);color:var(--color-ink-on-solid);display:flex;align-items:center;justify-content:center;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--color-surface-default),0 0 0 4px var(--color-ink-default)}
</style>
</helmet>
<div class="s {{fs}}">
  <div class="bar back"><button class="ib" type="button" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>대상자 수정</h1></div>
  <div class="body">
    <button class="btn line" type="button" style="margin-bottom: var(--space-xl)"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM8 10h4M8 14h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>엄마의 건강 카드</button>
    <div class="fld"><label>이름</label><div class="in">엄마</div></div>
    <div class="fld"><span class="lbl">색</span><div class="sws"><button class="sw p1" type="button" aria-label="파랑"></button><button class="sw p2 on" type="button" aria-label="주황" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="sw p3" type="button" aria-label="초록"></button><button class="sw p4" type="button" aria-label="보라"></button><button class="sw p5" type="button" aria-label="장미"></button><button class="sw p6" type="button" aria-label="청록"></button></div>
      <p class="note">이미 쓰는 색: 파랑(나). 같은 색도 고를 수 있어요.</p></div>
    <button class="btn danger" type="button">보관</button>
    <p class="note" style="padding:0 var(--space-2xs)">보관해도 지난 기록은 지워지지 않아요.</p>
  </div>
  <div class="foot line"><button class="btn ink" type="button">저장</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fontScale": {"editor": "enum", "options": ["100", "200"], "default": "100"}, "$preview": {"width": 360, "height": 800}}'>
class Component extends DCLogic {
  renderVals() {
    return { fs: (this.props.fontScale ?? '100') === '200' ? 'fs200' : '' };
  }
}
</script>
</body>
</html>
