[versions]
# Build toolchain
agp = "8.13.2"
kotlin = "2.4.21"
ksp = "2.3.12"
compose-multiplatform = "1.11.1"

# Android SDK levels
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"

# Libraries
room3 = "3.0.3"
androidx-sqlite = "2.7.1"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
androidx-activity = "1.13.0"
androidx-glance = "1.2.0"
# Glance 1.2.0이 런타임에 가져오는 WorkManager와 같은 판. 앱 시작 때 빈 작업을 넣는 데 직접 씀(BUG-004). 판을 올려도
# RescheduleReceiver를 켜고 끄는 것은 그대로라(PR #16 보고서 3절 7번) Glance가 가져오는 판에 맞춤
androidx-work = "2.7.1"
# 위젯·앱 화면 렌더 시험에만 씀(androidApp 단위 시험, TASK-014·015): Android의 뷰·글 배치·글꼴로 그림
robolectric = "4.17"
junit4 = "4.13.2"
androidx-test-core = "1.6.1"
# 앱 화면 시험의 Compose 시험 도구. Compose Multiplatform 1.11.1이 Android에서 가져오는 androidx.compose.ui와 같은 판
androidx-compose-ui-test = "1.11.2"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }

androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidx-glance" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui-test" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
